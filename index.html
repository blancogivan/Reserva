<style>
/* Layout: una columna de móvil (máx. 520px) con barra de pestañas fija abajo; tarjetas solo donde hay un objeto con entidad (rutina, serie, día). */
:root {
  --bg: #DFE5EE; --s1: rgba(255,255,255,.62); --s2: rgba(232,237,245,.85); --field: #FFFFFF; --line: #D7DDE6; --glow: rgba(47,91,224,.30); --glow2: rgba(242,183,5,.14);
  --tx: #0E1116; --tx2: #333B47; --mu: #5B6472; --dim: #AAB2BD;
  --ac: #2F5BE0; --acTx: #2449C2; --acSoft: #E6ECFD; --onAc: #FFFFFF;
  --leg: #E0A800; --legTx: #8A6400; --legSoft: #FDF3D3;
  --sp: #128A5A; --mt: #D93036;
  --ok: #1C7A45; --okSoft: #E2F4EA; --warn: #B25E00; --warnSoft: #FDEFD9;
  --shadow: 0 1px 2px rgba(14,17,22,.08), 0 6px 18px -8px rgba(14,30,80,.18);
  --f-body: 'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0B0E13; --s1: #151A22; --s2: #1F242D; --field: #12161C; --line: #262C36; --glow: rgba(61,107,245,.26); --glow2: rgba(242,183,5,.06);
  --tx: #EEF1F5; --tx2: #C9D0DA; --mu: #9AA3B2; --dim: #4A5260;
  --ac: #3D6BF5; --acTx: #8AA6FF; --acSoft: #1A2546; --onAc: #FFFFFF;
  --leg: #F2B705; --legTx: #F5C842; --legSoft: #352B0A;
  --sp: #2FB57C; --mt: #E5484D;
  --ok: #4FDB95; --okSoft: #12301F; --warn: #F5A524; --warnSoft: #3A2A0C;
  --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0B0E13; --s1: #151A22; --s2: #1F242D; --field: #12161C; --line: #262C36; --glow: rgba(61,107,245,.26); --glow2: rgba(242,183,5,.06);
  --tx: #EEF1F5; --tx2: #C9D0DA; --mu: #9AA3B2; --dim: #4A5260;
  --ac: #3D6BF5; --acTx: #8AA6FF; --acSoft: #1A2546; --onAc: #FFFFFF;
  --leg: #F2B705; --legTx: #F5C842; --legSoft: #352B0A;
  --sp: #2FB57C; --mt: #E5484D;
  --ok: #4FDB95; --okSoft: #12301F; --warn: #F5A524; --warnSoft: #3A2A0C;
  --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark }

html, body { height: 100%; }
body { padding-top: env(safe-area-inset-top, 0px); }
.cbox { display: block; padding: 8px 10px; border-radius: 10px; background: rgba(255,255,255,.06); font-size: 11px; word-break: break-all; font-family: ui-monospace, Menlo, monospace; color: var(--tx2); }
/* fondo fijo: el mismo en todas las pestañas y no se mueve al hacer scroll */
.bgfx { position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(120% 50% at 90% -6%, var(--glow), transparent 64%), radial-gradient(80% 40% at -12% 42%, var(--glow2), transparent 62%), radial-gradient(90% 45% at 110% 105%, var(--glow), transparent 60%), var(--bg); }
body { background: var(--bg); color: var(--tx); font-family: var(--f-body); font-size: 15px; line-height: 1.4; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ac); outline-offset: 2px; }
a { color: var(--acTx); text-decoration: none; }

.wrap { max-width: 520px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px calc(104px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; }
.wrap.noTab { padding-block-end: calc(28px + env(safe-area-inset-bottom, 0px)); }

/* tipografía: condensada para títulos y números, como un marcador */
.d { font-stretch: 72%; font-weight: 800; letter-spacing: -0.2px; line-height: .95; text-wrap: balance; }
.n { font-stretch: 78%; font-weight: 700; font-variant-numeric: tabular-nums; }
.cap { font-size: 11px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--mu); }
.mu { color: var(--mu); }
.sm { font-size: 13px; }
.xs { font-size: 12px; }
h1 { margin: 0; font-size: 42px; }
h2 { margin: 0; font-size: 26px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; }
.back { display: inline-flex; align-items: center; gap: 2px; min-height: 44px; padding: 0 6px 0 0; border: 0; background: none; color: var(--acTx); font-weight: 600; font-size: 16px; }
.link { border: 0; background: none; color: var(--acTx); font-weight: 600; min-height: 44px; padding: 0 4px; }
.brand { display: flex; align-items: center; gap: 8px; font-stretch: 72%; font-weight: 800; font-size: 22px; }

.card { --tx: #EEF1F5; --tx2: #C9D0DA; --mu: #A3AEC0; --dim: #5A6475; --line: rgba(255,255,255,.10); --s1: #171C26; --s2: rgba(255,255,255,.07); --field: rgba(255,255,255,.06);
  --acTx: #A9BEFF; --acSoft: rgba(61,107,245,.26); --warn: #FFB547; --warnSoft: rgba(255,181,71,.16); --ok: #5FE3A1; --okSoft: rgba(95,227,161,.16); --legTx: #F5C842; --legSoft: rgba(242,183,5,.16);
  color: var(--tx); border: 1px solid rgba(255,255,255,.07); border-radius: 20px;
  background: radial-gradient(120% 80% at 110% -10%, rgba(61,107,245,.22), transparent 55%), linear-gradient(165deg, #1A2033 0%, #10141C 75%);
  box-shadow: 0 10px 28px -14px rgba(16,24,60,.5); }
.card .btn.sec { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.12); color: var(--tx); }
.card select, .card input { color-scheme: dark; }
/* hero: la tarjeta-marcador, oscura en los dos temas */
.hero { --tx: #EEF1F5; --tx2: #C9D0DA; --mu: #A3AEC0; --line: rgba(255,255,255,.12); --s2: rgba(255,255,255,.08); --acTx: #A9BEFF; --acSoft: rgba(61,107,245,.28); --warn: #FFB547; --warnSoft: rgba(255,181,71,.16); --ok: #5FE3A1; --okSoft: rgba(95,227,161,.16);
  color: var(--tx); border-radius: 24px; padding: 18px 18px 16px; position: relative; overflow: hidden;
  background: radial-gradient(110% 90% at 105% -5%, rgba(61,107,245,.60), transparent 55%), radial-gradient(70% 60% at -10% 110%, rgba(61,107,245,.18), transparent 60%), linear-gradient(165deg, #1B2340 0%, #10141C 72%);
  box-shadow: 0 14px 34px -14px rgba(16,24,60,.55); }
.hero.leg { background: radial-gradient(110% 90% at 105% -5%, rgba(242,183,5,.45), transparent 55%), radial-gradient(70% 60% at -10% 110%, rgba(242,183,5,.12), transparent 60%), linear-gradient(165deg, #2A2414 0%, #12141A 72%); }
.hero::after { content: ""; position: absolute; right: -18px; top: 14px; width: 120px; height: 120px; opacity: .07; pointer-events: none;
  background: repeating-linear-gradient(90deg, #fff 0 14px, transparent 14px 22px); border-radius: 18px; }
.hero .chip { background: rgba(255,255,255,.10); color: var(--tx2); }
.hero .chip.ac { background: var(--acSoft); color: var(--acTx); }
.hero .chip.ok { background: var(--okSoft); color: var(--ok); }
.hero .chip.warn { background: rgba(255,181,71,.16); color: var(--warn); }
.hero .btn.sec { background: rgba(255,255,255,.10); border-color: rgba(255,255,255,.14); color: var(--tx); }
.calcout { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-radius: 16px; background: var(--acSoft); }
.ctabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.ctab { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0; border-radius: 12px; background: var(--s2); }
.ctab.on { background: var(--ac); color: var(--onAc); }
.ctab.on .mu { color: var(--onAc); opacity: .8; }
.hero, .card { --ac2: #5B84FF; --leg2: #F2B705; }
.nwrap { position: relative; }
.nbars { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.nb { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.nbar { height: 96px; width: 100%; display: flex; align-items: flex-end; justify-content: center; }
.nbar i { display: block; width: 100%; max-width: 28px; border-radius: 8px 8px 4px 4px; }
.nline { position: absolute; left: 0; right: 0; border-top: 1.5px dashed rgba(255,255,255,.4); z-index: 1; }
.nlab { position: absolute; right: 0; color: var(--mu); font-weight: 700; z-index: 1; }
.tdot { width: 6px; height: 6px; border-radius: 3px; background: transparent; }
.tdot.on { background: var(--tx); }
.rbars { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
.rb { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.rbz { position: relative; width: 100%; height: 64px; }
.rbz::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px solid rgba(255,255,255,.25); }
.rbz i { position: absolute; left: 50%; transform: translateX(-50%); width: 70%; max-width: 22px; border-radius: 4px; }
.kwrap { position: relative; }
.kbars { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 4px; align-items: end; }
.kb { display: flex; flex-direction: column; align-items: center; gap: 3px; height: 98px; justify-content: flex-end; }
.kb i { display: block; width: 100%; border-radius: 5px 5px 2px 2px; }
.kwrap .nline { bottom: 0; margin-bottom: 18px; }
.wbars { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.wbar { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.wtrack { width: 100%; max-width: 30px; height: 64px; border-radius: 9px; background: rgba(255,255,255,.08); position: relative; overflow: hidden; }
.wtrack.off { background: transparent; border: 1px dashed rgba(255,255,255,.14); box-sizing: border-box; }
.wtrack i { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 9px; transition: height .6s ease; }
.wbar.today .wtrack { box-shadow: 0 0 0 1.5px rgba(255,255,255,.55); }
.hwrap { position: relative; height: 70px; }
.hcols { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; height: 100%; align-items: end; justify-items: center; }
.hcols.lab { height: auto; text-align: center; line-height: 1.3; }
.hcols i { display: block; width: 100%; max-width: 34px; border-radius: 7px 7px 3px 3px; background: rgba(255,255,255,.18); }
.hcols i.on { background: linear-gradient(180deg, #8AA6FF, #3D6BF5); }
.hline { position: absolute; left: 0; right: 0; border-top: 1.5px dashed rgba(255,255,255,.35); }
@keyframes ringIn { from { stroke-dashoffset: 314.2; } }
.ringp { animation: ringIn .9s ease-out both; }
.setrow.pr { background: linear-gradient(90deg, rgba(242,183,5,.18), transparent 70%); }
.setrow.pr .sn.ok { background: rgba(242,183,5,.22); color: #F5C842; }
.pr-pop { position: fixed; inset: 0; z-index: 50; pointer-events: none; display: flex; align-items: center; justify-content: center; }
.pr-card { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 20px 28px; border-radius: 24px; color: #EEF1F5; text-align: center;
  background: radial-gradient(120% 120% at 50% 0%, rgba(242,183,5,.35), transparent 60%), linear-gradient(165deg, #22283A, #10141C); border: 1px solid rgba(242,183,5,.4); box-shadow: 0 20px 50px -10px rgba(0,0,0,.6); animation: prIn .45s cubic-bezier(.2,1.4,.4,1) both; }
.pr-card svg { width: 30px; height: 30px; }
@keyframes prIn { from { transform: scale(.6); opacity: 0; } }
.confeti { position: absolute; inset: 0; overflow: hidden; }
.confeti i { position: absolute; top: 38%; width: 8px; height: 12px; border-radius: 2px; animation-name: conf; animation-timing-function: cubic-bezier(.2,.7,.4,1); animation-fill-mode: both; }
@keyframes conf { 0% { translate: 0 0; opacity: 1; } 100% { translate: 0 46vh; rotate: 540deg; opacity: 0; } }
.note.ok { background: var(--okSoft); color: var(--ok); display: flex; align-items: center; gap: 8px; font-weight: 600; }
.pad { padding: 14px 16px; }
.stripe { height: 4px; border-radius: 20px 20px 0 0; background: var(--ac); }
.stripe.pierna { background: var(--leg); }
.row { display: flex; align-items: center; gap: 10px; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.list > * + * { border-top: 1px solid var(--line); }
.minw { min-width: 0; }
.grow { flex: 1 1 auto; min-width: 0; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 54px; border-radius: 16px; border: 0; background: var(--ac); color: var(--onAc); font-weight: 700; font-size: 16px; padding: 0 18px; width: 100%; }
.btn.sec { background: var(--s2); color: var(--tx); border: 1px solid var(--line); font-weight: 600; }
.btn.slim { min-height: 44px; border-radius: 12px; font-size: 14px; width: auto; padding: 0 14px; }
.btn.danger { background: var(--s2); color: var(--mt); border: 1px solid var(--line); }
.btn:disabled { opacity: .45; }
.icon { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--s2); color: var(--mu); display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 4px 10px; background: var(--s2); color: var(--mu); white-space: nowrap; }
.chip.ac { background: var(--acSoft); color: var(--acTx); }
.chip.ok { background: var(--okSoft); color: var(--ok); }
.chip.warn { background: var(--warnSoft); color: var(--warn); }
.chip.leg { background: var(--legSoft); color: var(--legTx); }
.dash { border: 1.5px dashed var(--mu); border-radius: 16px; min-height: 52px; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; color: var(--acTx); background: none; width: 100%; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); background: var(--s2); border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { min-height: 40px; border: 0; border-radius: 11px; background: transparent; color: var(--mu); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--s1); color: var(--tx); font-weight: 700; box-shadow: var(--shadow); }
.note { background: var(--acSoft); border-radius: 18px; padding: 12px 14px; font-size: 14px; line-height: 1.45; }
.note.warn { background: var(--warnSoft); }
.empty { border: 1.5px dashed var(--line); border-radius: 18px; padding: 18px; text-align: center; color: var(--mu); font-size: 14px; }

/* semana */
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; border-radius: 12px; font-size: 12px; }
.wd.today { background: var(--acSoft); }
.wd b { font-stretch: 78%; font-size: 15px; }
.dot { width: 8px; height: 8px; border-radius: 4px; box-sizing: border-box; }

/* sesión */
.prog { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; }
.prog span { height: 4px; border-radius: 2px; background: var(--line); }
.prog span.on { background: var(--ac); }
.prog span.done { background: var(--ok); }
.setrow { display: grid; grid-template-columns: 44px minmax(0, 1fr) minmax(0, 1fr) 54px; align-items: center; padding: 8px 14px; }
.setrow.head { padding-block: 10px 4px; }
.setrow.done, .setrow.pend, .setedit { border-top: 1px solid var(--line); }
.setrow.pend { color: var(--dim); }
.setrow.pend .n { color: var(--dim); }
.sn { width: 26px; height: 26px; border-radius: 13px; display: inline-flex; align-items: center; justify-content: center; font-stretch: 78%; font-weight: 700; font-size: 14px; border: 1.5px dashed var(--dim); color: var(--mu); box-sizing: border-box; }
.sn.ok { border: 0; background: var(--okSoft); color: var(--ok); }
.sn svg { width: 16px; height: 16px; }
.setedit { background: var(--s2); padding: 12px 14px 14px; box-shadow: inset 3px 0 0 var(--ac); }
.stepper { display: grid; grid-template-columns: 48px minmax(0, 1fr) 48px; align-items: center; background: var(--field); border: 1px solid var(--line); border-radius: 14px; height: 54px; }
.stepper button { height: 52px; border: 0; background: transparent; font-size: 24px; color: var(--tx); }
.stepper input { width: 100%; border: 0; background: transparent; text-align: center; font-stretch: 78%; font-weight: 700; font-size: 26px; font-variant-numeric: tabular-nums; padding: 0; min-width: 0; }
.rir { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.rir button { height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--field); font-stretch: 78%; font-weight: 700; font-size: 18px; }
.rir button[aria-pressed="true"] { background: var(--ac); border-color: var(--ac); color: var(--onAc); }
.restbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--s1); border-top: 1px solid var(--line); padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.restbar .in { max-width: 520px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }

/* calendario */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.cal .h { text-align: center; font-size: 11px; font-weight: 700; letter-spacing: 1px; color: var(--mu); padding-bottom: 2px; }
.cal button { height: 46px; border: 0; border-radius: 12px; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-stretch: 78%; font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; }
.cal button { color: var(--tx); }
.cal button.out { color: var(--dim); }
.hero { --dim: #5A6475; }
.hero.plain::after { display: none; }
.cal button.today { box-shadow: inset 0 0 0 1.5px var(--mu); font-weight: 800; }
.cal button[aria-pressed="true"] { background: var(--ac); color: var(--onAc); font-weight: 800; box-shadow: none; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--mu); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }

.field { width: 100%; box-sizing: border-box; height: 48px; border-radius: 14px; border: 1px solid var(--line); background: var(--field); padding: 0 12px; font-size: 16px; }
.lbl { display: flex; flex-direction: column; gap: 4px; }
.bar { position: relative; height: 8px; background: var(--s2); border-radius: 4px; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--ac); }
.bar b { position: absolute; top: -4px; width: 3px; height: 16px; border-radius: 2px; background: var(--tx); }

/* pestañas */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: color-mix(in srgb, var(--s1) 82%, transparent); -webkit-backdrop-filter: saturate(160%) blur(18px); backdrop-filter: saturate(160%) blur(18px); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.tabs .in { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
.tabs button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 48px; justify-content: center; font-size: 11px; font-weight: 600; color: var(--mu); }
.tabs button span.pill { display: flex; align-items: center; justify-content: center; width: 52px; height: 28px; border-radius: 14px; }
.tabs button[aria-current="page"] { color: var(--acTx); }
.tabs button[aria-current="page"] span.pill { background: var(--acSoft); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--tx); color: var(--bg); padding: 10px 16px; border-radius: 14px; font-weight: 600; font-size: 14px; max-width: calc(100% - 32px); }
.sheet-bg { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; }

<div class="bgfx" aria-hidden="true"></div>
<div id="app"></div>
<div id="layer"></div>

<script>
'use strict';
/* =====================================================================
   Reserva v1 · Cada regla cita su ID de la Especificación científica.
   R-10 series fraccionadas (directa 1, indirecta 0,5)
   R-20 RIR objetivo · R-40 doble progresión · R-41 incremento por máquina
   R-42 estancamiento (3 sesiones sin mejorar el 1RM estimado)
   R-43 cada máquina/variante es un ejercicio propio
   R-71 descanso 120 s compuestos / 90 s aislamiento
   R-91 partido lunes o martes: se intercambian Pierna y Repaso
   R-101 1RM estimado con Epley, solo series de 1–12 reps
   R-130 cambiar rutina / sesión libre · R-131 editar la sesión del día
   ===================================================================== */

const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const DL = ['L','M','X','J','V','S','D'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DEPORTES = ['Baloncesto (partido)','Baloncesto (entreno)','Fútbol','Pádel','Ruta / senderismo','Bici','Correr','Otra actividad'];

const S = {
  db: null, mode: 'cargando', cat: {}, rut: {}, ses: [], act: [], aj: null, activa: null,
  view: 'hoy', prev: [], draft: null, calSel: null, calMes: null, progTab: 'resumen', ejSel: null,
  salud: {}, bien: {}, saludMeta: null,
  q: '', restEnd: 0, restTotal: 0, toastT: 0, scope: 'hoy', altOpen: -1, pickFor: null
};

/* ---------- utilidades ---------- */
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = (v, d = 1) => { if (v == null || isNaN(v)) return '–'; const r = Math.round(v * 10 ** d) / 10 ** d; return String(r).replace('.', ','); };
const kgf = (v) => num(v, 2);
const pad2 = (n) => String(n).padStart(2, '0');
const ymd = (d) => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const parseD = (s) => { const [a, b] = String(s).split('T'); const [y, m, d] = a.split('-').map(Number); const [hh = 0, mm = 0] = (b || '').split(':').map(Number); return new Date(y, m - 1, d, hh, mm); };
const hoy = () => new Date();
const dow1 = (d) => (d.getDay() + 6) % 7; // 0 = lunes
const lunes = (d) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - dow1(x)); return x; };
const fCorta = (d) => d.getDate() + ' ' + MESES[d.getMonth()].slice(0, 3);
const dias = (a, b) => Math.round((new Date(b.getFullYear(), b.getMonth(), b.getDate()) - new Date(a.getFullYear(), a.getMonth(), a.getDate())) / 864e5);
const nombre = (id) => S.cat[id]?.nombre || id;
const ls = { get(k) { try { return JSON.parse(localStorage.getItem('reserva.' + k)); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem('reserva.' + k, JSON.stringify(v)); } catch (e) {} } };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const I = {
  back: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
  play: '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg>',
  plus: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  trash: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  x: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  check: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  star: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg>',
  chev: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>',
  logo: (c) => '<svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="8" fill="' + c + '"/><rect x="5.5" y="7" width="3" height="12" rx="1.5" fill="#fff"/><rect x="10" y="7" width="3" height="12" rx="1.5" fill="#fff"/><rect x="14.5" y="7" width="3" height="12" rx="1.5" fill="#fff"/><rect x="19.25" y="7.75" width="1.5" height="10.5" rx=".75" fill="none" stroke="#fff" stroke-width="1.5"/></svg>'
};
const TAB_ICONS = {
  hoy: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  calendario: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  progreso: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  descanso: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
  nutricion: '<path d="M12 3c4 4 6 7 6 10a6 6 0 0 1-12 0c0-3 2-6 6-10z"/>'
};

/* ---------- datos derivados ---------- */
const sesOrd = () => S.ses.slice().sort((a, b) => (a.fecha < b.fecha ? -1 : 1));
function historial(ej) { // sesiones (de más antigua a más nueva) con las series de ese ejercicio
  const out = [];
  for (const s of sesOrd()) for (const e of s.ejercicios || []) if (e.ej === ej && e.series?.length) out.push({ fecha: s.fecha, series: e.series });
  return out;
}
const epley = (kg, reps) => (reps >= 1 && reps <= 12 ? kg * (1 + reps / 30) : null); // R-101
function mejorE1(series) { let m = null; for (const x of series) { const v = epley(x.kg, x.reps); if (v != null && (m == null || v > m)) m = v; } return m; }
const maxKg = (series) => Math.max(...series.map((x) => x.kg));

function estancado(ej) { // R-42
  if (S.cat[ej]?.ayuda) return false;
  const h = historial(ej).map((x) => mejorE1(x.series)).filter((v) => v != null);
  const N = 3; if (h.length < N + 1) return false;
  const previo = Math.max(...h.slice(0, -N));
  return h.slice(-N).every((v) => v <= previo);
}

function sugerencia(ej, plan) { // R-40, R-41, R-43
  const c = S.cat[ej] || { inc: 2.5 };
  const min = plan?.min ?? 8, max = plan?.max ?? 12, n = plan?.series ?? 3;
  const h = historial(ej);
  if (!h.length) return { kg: null, reps: min, txt: 'Primera vez: elige un peso con el que llegues a ' + min + '–' + max + ' repeticiones. Esta sesión será tu referencia.', tipo: 'nuevo' };
  const ult = h[h.length - 1];
  const fecha = parseD(ult.fecha);
  const top = c.ayuda ? Math.min(...ult.series.map((x) => x.kg)) : maxKg(ult.series);
  const aTop = ult.series.filter((x) => x.kg === top);
  const todas = aTop.length >= Math.min(n, ult.series.length) && aTop.every((x) => x.reps >= max);
  const hace = dias(fecha, hoy());
  const ultTxt = ult.series.map((x) => kgf(x.kg) + '×' + x.reps).join(' · ');
  if (hace > 42) return { kg: Math.round(top * 0.9 / c.inc) * c.inc, reps: min, txt: 'Hace ' + Math.round(hace / 7) + ' semanas que no lo haces: empieza un 10 % más ligero.', tipo: 'viejo', ult: ultTxt, fecha };
  if (todas) {
    const nk = c.ayuda ? Math.max(0, top - c.inc) : top + c.inc;
    return { kg: nk, reps: min, txt: (c.ayuda ? 'Llegaste a ' + max + ' en todas: baja la ayuda a ' : 'Llegaste a ' + max + ' en todas: sube a ') + kgf(nk) + ' kg y vuelve a ' + min + ' repeticiones.', tipo: 'sube', ult: ultTxt, fecha };
  }
  const best = Math.max(...aTop.map((x) => x.reps));
  return { kg: top, reps: Math.min(max, best + 1), txt: 'Mismo peso, ' + kgf(top) + ' kg: intenta una repetición más que la última vez. Cuando hagas ' + max + ' en todas, subes.', tipo: 'igual', ult: ultTxt, fecha };
}

function semanaPlan(ref) { // R-91
  const plan = Object.assign({}, S.aj?.plan || { 1: 'torso-a', 2: 'pierna', 4: 'torso-b', 5: 'repaso' });
  const L = lunes(ref);
  const partido = S.act.some((a) => a.tipo === 'Baloncesto (partido)' && (() => { const d = parseD(a.fecha); const k = dias(L, d); return k === 0 || k === 1; })());
  let swapped = false;
  if (partido) {
    const dp = Object.keys(plan).find((k) => plan[k] === 'pierna'), dr = Object.keys(plan).find((k) => plan[k] === 'repaso');
    if (dp && dr) { plan[dp] = 'repaso'; plan[dr] = 'pierna'; swapped = true; }
  }
  return { plan, swapped };
}
function hechaEstaSemana(rid, ref) { const L = lunes(ref); return S.ses.find((s) => s.rutina === rid && dias(L, parseD(s.fecha)) >= 0 && dias(L, parseD(s.fecha)) < 7); }
function rutinaDeHoy() {
  const d = hoy(); const { plan, swapped } = semanaPlan(d);
  const wd = String(d.getDay());
  if (plan[wd]) return { rid: plan[wd], swapped, descanso: false };
  // día sin plan: propone la siguiente rutina de la semana que aún no está hecha
  for (let k = 1; k <= 7; k++) { const dd = new Date(d); dd.setDate(d.getDate() + k); const r = plan[String(dd.getDay())]; if (r) return { rid: r, swapped, descanso: true, cuando: DIAS[dd.getDay()] }; }
  return { rid: Object.keys(S.rut)[0], swapped, descanso: true };
}
function volumenSemanal(semanas) { // R-10
  const L0 = lunes(hoy()); L0.setDate(L0.getDate() - 7 * semanas);
  const v = {};
  for (const s of S.ses) { const d = parseD(s.fecha); if (d < L0 || d >= lunes(hoy())) continue; for (const e of s.ejercicios || []) { const m = S.cat[e.ej]?.musculos || {}; for (const k in m) v[k] = (v[k] || 0) + m[k] * e.series.length; } }
  for (const k in v) v[k] /= semanas;
  return v;
}

/* ---------- persistencia ---------- */
async function guardar(col, id, data) {
  if (col === 'sesiones') { const i = S.ses.findIndex((x) => x._id === id); const o = Object.assign({ _id: id }, data); if (i >= 0) S.ses[i] = o; else S.ses.push(o); }
  if (col === 'actividades') { const i = S.act.findIndex((x) => x._id === id); const o = Object.assign({ _id: id }, data); if (i >= 0) S.act[i] = o; else S.act.push(o); }
  if (col === 'rutinas') S.rut[id] = data;
  if (S.db) { try { await S.db.collection(col).doc(id).set(data); } catch (e) { aviso(e.code === 'quota_exceeded' ? 'No queda espacio para guardar más. Avísame y lo ampliamos.' : 'No se ha podido guardar. Revisa la conexión y vuelve a intentarlo.'); throw e; } }
  else { const k = 'local.' + col; const o = ls.get(k) || {}; o[id] = data; ls.set(k, o); }
}
async function borrar(col, id) {
  if (col === 'actividades') S.act = S.act.filter((x) => x._id !== id);
  if (S.db) { try { await S.db.collection(col).doc(id).delete(); } catch (e) { aviso('No se ha podido borrar. Vuelve a intentarlo.'); } }
  else { const k = 'local.' + col; const o = ls.get(k) || {}; delete o[id]; ls.set(k, o); }
}
function guardarActiva() {
  ls.set('activa', S.activa);
  if (S.db) S.db.collection('estado').doc('activa').set(S.activa ? { sesion: S.activa } : { sesion: null }).catch(() => {});
}

/* ---------- navegación ---------- */
function ir(v, opts = {}) { if (!opts.tab) S.prev.push(S.view); else S.prev = []; S.view = v; window.scrollTo(0, 0); render(); }
function volver() { S.view = S.prev.pop() || 'hoy'; render(); }
function aviso(t) { clearTimeout(S.toastT); $('#layer').innerHTML = '<div class="toast" role="status">' + esc(t) + '</div>'; S.toastT = setTimeout(() => { $('#layer').innerHTML = ''; }, 2600); }

/* ---------- vistas ---------- */
function tabs(act) {
  const T = [['hoy', 'Hoy'], ['calendario', 'Calendario'], ['progreso', 'Progreso'], ['descanso', 'Descanso'], ['nutricion', 'Nutrición']];
  return '<nav class="tabs" aria-label="Secciones"><div class="in">' + T.map(([k, l]) => '<button type="button" data-act="tab" data-v="' + k + '"' + (k === act ? ' aria-current="page"' : '') + '><span class="pill"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + TAB_ICONS[k] + '</svg></span>' + l + '</button>').join('') + '</div></nav>';
}
function modoAviso() {
  const p = Nube.outbox.length;
  if (!navigator.onLine) return '<div class="note warn sm">Sin cobertura. Puedes seguir apuntando: ' + (p ? p + ' cambios se guardarán' : 'se guardará todo') + ' en tu cuenta cuando vuelva la conexión.</div>';
  if (p) return '<div class="note sm">Guardando ' + p + ' cambios en tu cuenta…</div>';
  return '';
}

function vHoy() {
  const d = hoy();
  const r = rutinaDeHoy();
  const rid = S.draft?.fecha === ymd(d) && S.draft.rid ? S.draft.rid : r.rid;
  const rut = S.rut[rid];
  const hecha = S.ses.find((s) => s.rutina === rid && ymd(parseD(s.fecha)) === ymd(d));
  const { plan } = semanaPlan(d);
  const L = lunes(d);
  const week = DL.map((l, i) => {
    const dd = new Date(L); dd.setDate(L.getDate() + i);
    const rr = plan[String(dd.getDay())];
    const done = S.ses.some((s) => ymd(parseD(s.fecha)) === ymd(dd));
    const actv = S.act.find((a) => a.fecha === ymd(dd));
    let dot = 'background:transparent';
    if (done) { const sd = S.ses.find((s) => ymd(parseD(s.fecha)) === ymd(dd)); dot = 'background:' + (S.rut[sd.rutina]?.tipo === 'pierna' || /pierna/i.test(sd.nombre || '') ? 'var(--leg)' : 'var(--ac)'); }
    else if (actv) dot = 'background:' + (actv.tipo === 'Baloncesto (partido)' ? 'var(--mt)' : 'var(--sp)');
    else if (rr) dot = 'border:1.5px solid ' + (S.rut[rr]?.tipo === 'pierna' ? 'var(--leg)' : 'var(--ac)');
    return '<div class="wd' + (ymd(dd) === ymd(d) ? ' today' : '') + '"><span class="mu">' + l + '</span><b>' + dd.getDate() + '</b><span class="dot" style="' + dot + '"></span></div>';
  }).join('');
  let main;
  if (S.activa) {
    const a = S.activa; const tot = a.ejercicios.reduce((t, e) => t + e.series.length, 0);
    main = '<section class="hero" aria-label="Sesión en curso"><div class="stack"><span class="cap">Sesión en curso</span><h2 class="d">' + esc(a.nombre) + '</h2><span class="mu sm">' + tot + ' series guardadas · empezaste a las ' + pad2(parseD(a.inicio).getHours()) + ':' + pad2(parseD(a.inicio).getMinutes()) + '</span><button class="btn" data-act="continuar">' + I.play + 'Continuar</button></div></section>';
  } else if (!rut) {
    main = '<div class="empty">Cargando tus rutinas…</div>';
  } else {
    const base = (S.draft?.fecha === ymd(d) ? S.draft.items : rut.ejercicios); const items = deloadActivo() ? planDeload(base) : base; // R-82
    const marca = semanaMarcada();
    const series = items.reduce((t, e) => t + e.series, 0);
    const lista = items.map((e) => { const s = sugerencia(e.ej, e); const tag = s.tipo === 'sube' ? '<span class="chip warn">Sube peso</span>' : s.tipo === 'nuevo' ? '<span class="chip ac">Nuevo</span>' : ''; return '<div class="between" style="padding:9px 0"><span class="minw"><span style="font-weight:600">' + esc(nombre(e.ej)) + '</span><br><span class="mu xs n" style="font-size:13px">' + e.series + ' × ' + e.min + '–' + e.max + (s.kg != null ? ' · ' + kgf(s.kg) + ' kg' : '') + '</span></span>' + tag + '</div>'; }).join('');
    main = '<section class="hero' + (rut.tipo === 'pierna' ? ' leg' : '') + '" aria-label="Rutina de hoy"><div class="stack">' +
      '<div class="between"><span class="cap">' + (r.descanso && !S.draft ? 'Hoy toca descanso · la siguiente es el ' + esc(r.cuando || '') : 'Rutina de hoy') + '</span>' + (hecha ? '<span class="chip ok">' + I.check + 'Hecha</span>' : marca ? '<span class="chip">' + ESTADOS[marca] + '</span>' : deloadActivo() ? '<span class="chip leg">Descarga</span>' : '') + '</div>' +
      '<h2 class="d" style="font-size:56px">' + esc(rut.nombre) + '</h2><span class="mu sm n" style="font-size:14px">' + items.length + ' ejercicios · ' + series + ' series</span>' +
      (r.swapped ? '<div class="note sm">Esta semana tienes partido el lunes o el martes, así que Pierna y Repaso se han intercambiado.</div>' : '') +
      '<div class="list">' + lista + '</div>' +
      '<button class="btn" data-act="empezar">' + I.play + (r.descanso && !S.draft ? 'Entrenar igualmente' : 'Empezar') + '</button>' +
      '<div class="row" style="justify-content:space-between"><button class="link" data-act="ir" data-v="cambiar">Cambiar rutina</button><button class="link" data-act="editar">Editar ejercicios</button></div>' +
      '<button class="link" data-act="hojaSemana" style="align-self:center;color:var(--mu);font-weight:500">' + (marca ? 'Semana marcada: ' + ESTADOS[marca] + ' · cambiar' : '¿Semana complicada? Márcala') + '</button>' +
      '</div></section>';
  }
  const ult = sesOrd().slice(-1)[0];
  return '<div class="wrap">' + modoAviso() +
    '<div class="top"><span class="brand">' + I.logo('var(--ac)') + 'Reserva</span><span class="row" style="gap:6px"><span class="mu sm">' + DIAS[d.getDay()].replace(/^./, (x) => x.toUpperCase()) + ' ' + d.getDate() + ' de ' + MESES[d.getMonth()] + '</span><button class="icon" style="width:36px;height:36px;border-radius:18px" data-act="ir" data-v="cuenta" aria-label="Ajustes"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></span></div>' +
    '<div class="card pad"><div class="week">' + week + '</div></div>' + (S.activa ? '' : tarjetaDeload()) + main +
    (ult && !S.activa ? '<div class="mu sm" style="padding:0 4px">Última sesión: ' + esc(ult.rutina ? (S.rut[ult.rutina]?.nombre || ult.nombre) : ult.nombre) + ', ' + fCorta(parseD(ult.fecha)) + '.</div>' : '') +
    '<p class="mu xs" style="margin:0;padding:0 4px">Si notas dolor (no agujetas) en una articulación, para ese ejercicio y consúltalo con un fisioterapeuta o un médico.</p>' +
    '</div>' + tabs('hoy');
}

function vCalendario() {
  const t = hoy(); const M = S.calMes || new Date(t.getFullYear(), t.getMonth(), 1);
  const sel = S.calSel || ymd(t);
  const first = new Date(M.getFullYear(), M.getMonth(), 1); const start = new Date(first); start.setDate(1 - dow1(first));
  const { plan } = semanaPlan(t);
  const cells = [];
  for (let k = 0; k < 42; k++) {
    const d = new Date(start); d.setDate(start.getDate() + k);
    if (k >= 35 && d.getMonth() !== M.getMonth()) break;
    const key = ymd(d); const out = d.getMonth() !== M.getMonth();
    const ss = S.ses.filter((s) => ymd(parseD(s.fecha)) === key); const aa = S.act.filter((a) => a.fecha === key);
    let dot = 'background:transparent';
    const on = key === sel;
    if (ss.length) dot = 'background:' + (ss.some((s) => S.rut[s.rutina]?.tipo === 'pierna' || /pierna/i.test(s.nombre)) ? 'var(--leg)' : 'var(--ac)');
    else if (aa.length) dot = 'background:' + (aa.some((a) => a.tipo === 'Baloncesto (partido)') ? 'var(--mt)' : 'var(--sp)');
    else if (d > t && dias(t, d) < 7 - dow1(t) && plan[String(d.getDay())]) dot = 'border:1.5px solid ' + (S.rut[plan[String(d.getDay())]]?.tipo === 'pierna' ? 'var(--leg)' : 'var(--ac)');
    if (on && dot !== 'background:transparent') dot += ';box-shadow:0 0 0 1.5px #fff';
    cells.push('<button type="button" data-act="calSel" data-v="' + key + '" class="' + (out ? 'out' : '') + (key === ymd(t) ? ' today' : '') + '" aria-pressed="' + on + '" aria-label="' + d.getDate() + ' de ' + MESES[d.getMonth()] + '"><span>' + d.getDate() + '</span><span class="dot" style="width:7px;height:7px;' + dot + '"></span></button>');
  }

function rirObjetivo(ses, ej) { // R-20

  const t = p?.rir || (S.cat[ej]?.compuesto ? '1-2' : '0-1'); const [a, b] = t.split('-').map(Number); return [a, b ?? a];

function semanaCard() { // series hechas frente a previstas (plan semanal R-30/§14e, intercambio R-91)

    const d = new Date(L); d.setDate(L.getDate() + i);

    const ses = S.ses.filter((s) => ymd(parseD(s.fecha)) === ymd(d));

    return { l, d, rid, prev, hechas, pierna: S.rut[rid]?.tipo === 'pierna' || ses.some((s) => S.rut[s.rutina]?.tipo === 'pierna' || /pierna/i.test(s.nombre || '')), futuro: dias(t, d) > 0, hoy: ymd(d) === ymd(t) };
  });
  const prev = dias7.reduce((x, d) => x + d.prev, 0);

  const pct = prev ? Math.round((hechas / prev) * 100) : 0;
  const sesPrev = dias7.filter((d) => d.prev).length; const sesHechas = dias7.filter((d) => d.hechas).length;

  // últimas 6 semanas
  const sem = []; for (let k = 5; k >= 0; k--) { const a = new Date(L); a.setDate(L.getDate() - 7 * k); let n = 0; for (const s of S.ses) { const dd = dias(a, parseD(s.fecha)); if (dd >= 0 && dd < 7) n += s.ejercicios.reduce((y, e) => y + e.series.length, 0); } sem.push({ a, n, actual: k === 0 }); }
  const maxS = Math.max(prev, ...sem.map((x) => x.n), 1);

  const pend = dias7.filter((d) => d.prev && !d.hechas && (d.futuro || d.hoy));

const DIA_COMPLETO_KCAL = 1200; // R-150 [DISEÑO]

function durSeg(t) { let s = 0; for (const x of String(t).split(':')) s = s * 60 + (parseFloat(x) || 0); return s; }

function parseSalud(text) { // R-145, R-146

      if (p.length !== 4) continue;
      const [tipo, valor, dur, fecha] = p; const d = fLocal(fecha); if (!d) continue;
      const clave = tipo + '|' + valor + '|' + fecha; if (vistos.has(clave)) continue; vistos.add(clave);
      const k = ymd(d);
      if (tipo === 'Sleep') sleep.push({ a: d, b: new Date(d.getTime() + durSeg(dur) * 1000), v: valor });
      else if (tipo === 'Resting Heart Rate') fc[k] = Math.round(parseFloat(valor));
      else if (tipo === 'Weight') { if (!peso[k] || d > peso[k].d) peso[k] = { d, v: Math.round(parseFloat(valor) * 100) / 100 }; }
      else if (tipo === 'Dietary Calories') kcal[k] = (kcal[k] || 0) + parseFloat(valor);

  for (const g of ses) {
    const sl = g.filter((x) => x.v !== 'Awake' && x.v !== 'InBed'); if (!sl.length) continue;
    const ini = new Date(Math.min(...sl.map((x) => x.a))), fin = new Date(Math.max(...sl.map((x) => x.b)));
    const dorm = sl.reduce((t, x) => t + (x.b - x.a), 0) / 60000;
    const desp = g.filter((x) => x.v === 'Awake' && x.b > ini && x.a < fin).reduce((t, x) => t + (Math.min(x.b, fin) - Math.max(x.a, ini)), 0) / 60000;

  for (const k in kcal) dia(k).kcal = Math.round(kcal[k]);
  for (const k in prot) dia(k).prot = Math.round(prot[k]);

}

   v3 · récords, resumen, mapa muscular, estado de la semana, descarga y volumen
   R-10/R-11 series por músculo (10–12; prioritarios 12–18; aviso < 4 o > 25)
   R-12 +1–2 series si un músculo se estanca 3 semanas y la fatiga está bien
   R-80 preparación · R-81 sugerir descarga · R-82 descarga: mitad de series, misma carga, RIR 3–4

const PRIORITARIOS = { 'Deltoides lateral': [12, 18], 'Pecho superior': [12, 18] }; // R-11, §1

const UMBRAL_CAIDA = -0.03; // R-81, R-151 [DISEÑO]
const RED_DELOAD = 0.5; // R-82

/* ---------- estado guardado (ajustes/estado) ---------- */
function guardarEstado(cambios) {
  S.estado = Object.assign({}, S.estado || {}, cambios);
  if (S.db) S.db.collection('ajustes').doc('estado').set(S.estado).catch(() => aviso('No se ha podido guardar.'));
  else ls.set('estado', S.estado);
}
function semanaMarcada(d = hoy()) { const x = S.estado?.semana; return x && x.lunes === ymd(lunes(d)) ? x.tipo : null; }
function deloadActivo(d = hoy()) { const x = S.estado?.deload; return !!(x && ymd(d) >= x.desde && ymd(d) <= x.hasta); }
function planDeload(items) { return items.map((e) => Object.assign({}, e, { series: Math.max(1, Math.ceil(e.series * (1 - RED_DELOAD))), rir: '3-4' })); } // R-82

/* ---------- rendimiento y preparación (R-80, R-81) ---------- */
function rendimientoSesiones() {
  const ses = sesOrd(); const out = [];
  for (let i = 0; i < ses.length; i++) {
    const cambios = [];
    for (const e of ses[i].ejercicios || []) {
      if (S.cat[e.ej]?.ayuda) continue; const v = mejorE1(e.series); if (v == null) continue;
      const prev = []; for (let j = i - 1; j >= 0 && prev.length < 3; j--) { const x = ses[j].ejercicios.find((y) => y.ej === e.ej); const w = x ? mejorE1(x.series) : null; if (w != null) prev.push(w); }
      if (prev.length >= 2) cambios.push(v / media(prev) - 1);
    }
    if (cambios.length >= 2) out.push({ fecha: ses[i].fecha, cambio: mediana(cambios), n: cambios.length });
  }
  return out;
}
function diasPreparacionBaja(n = 7) {
  const t = hoy(); const d30 = new Date(t); d30.setDate(t.getDate() - 30);
  const fcm = media(saludRango(d30, t).filter((x) => x.fc != null).map((x) => x.fc));
  let bajos = 0; const det = [];
  for (let i = 0; i < n; i++) {
    const d = new Date(t); d.setDate(t.getDate() - i); const k = ymd(d); const s = saludDia(k) || {}; const b = S.bien[k] || {};
    const señales = [s.sueno && s.sueno.min < 390, s.fc != null && fcm != null && s.fc > fcm + 5, b.energia === 0, b.agujetas === 0].filter(Boolean).length;
    if (señales >= 2) { bajos++; det.push(k); }

}
function propuestaDeload() { // R-81

  const recientes = ult.length === 2 && ult.every((x) => dias(parseD(x.fecha), hoy()) <= 14);
  if (recientes && ult.every((x) => x.cambio < UMBRAL_CAIDA)) return { motivo: 'rend', datos: ult };
  const p = diasPreparacionBaja(7); if (p.bajos >= 5) return { motivo: 'prep', datos: p };

}
function tarjetaDeload() {
  if (deloadActivo()) {

/* ---------- sugerencia de volumen (R-12) ---------- */
function sugerenciasVolumen() {
  if (deloadActivo() || semanaMarcada() || propuestaDeload()) return '';
  const t = hoy(); const c21 = new Date(t); c21.setDate(t.getDate() - 21); const c63 = new Date(t); c63.setDate(t.getDate() - 63);
  // R-12 solo se evalúa con 3 semanas siguiendo el plan actual en Reserva, y con el volumen que marca el plan
  const primera = sesOrd().find((x) => x.fuente === 'app'); if (!primera || dias(parseD(primera.fecha), t) < 21) return '';
  const vol = {}; const { plan } = semanaPlan(t);
  for (const rid of Object.values(plan)) for (const e of S.rut[rid]?.ejercicios || []) { const m = S.cat[e.ej]?.musculos || {}; for (const k in m) vol[k] = (vol[k] || 0) + m[k] * e.series; }
  const out = [];
  for (const m in PRIORITARIOS) {
    if ((S.estado?.volDescartado || {})[m] && dias(parseD(S.estado.volDescartado[m]), t) < 21) continue;
    const ejs = []; for (const [rid, r] of Object.entries(S.rut)) for (const e of r.ejercicios) if ((S.cat[e.ej]?.musculos || {})[m] === 1) ejs.push({ rid, e });
    if (!ejs.length) continue;
    const est = ejs.every(({ e }) => { const h = historial(e.ej); const a = h.filter((x) => parseD(x.fecha) >= c21).map((x) => mejorE1(x.series)).filter(Boolean); const b = h.filter((x) => parseD(x.fecha) >= c63 && parseD(x.fecha) < c21).map((x) => mejorE1(x.series)).filter(Boolean); return a.length && b.length && Math.max(...a) <= Math.max(...b); });
    if (!est || (vol[m] || 0) >= PRIORITARIOS[m][1]) continue;
    const obj = ejs.slice().sort((a, b) => a.e.series - b.e.series)[0];
    out.push({ m, rid: obj.rid, ej: obj.e.ej, v: vol[m] || 0 });
  }
  if (!out.length) return '';
  return '<section class="card pad stack" style="gap:10px"><span class="cap">Sugerencia para el bloque</span>' + out.map((x) => '<div class="stack" style="gap:6px"><span class="sm" style="line-height:1.45;color:var(--tx2)"><b style="color:var(--tx)">' + esc(x.m) + '</b> lleva 3 semanas sin progresar con ' + num(x.v, 1) + ' series por semana en tu plan, y tu recuperación está bien. Prueba a añadir 1 serie a <b style="color:var(--tx)">' + esc(nombre(x.ej)) + '</b> en ' + esc(S.rut[x.rid]?.nombre || '') + '.</span><div class="row" style="gap:8px"><button class="btn slim" style="flex:1" data-act="addSerieRut" data-id="' + x.rid + '" data-ej="' + x.ej + '" data-m="' + esc(x.m) + '">Añadir la serie</button><button class="btn sec slim" data-act="noVol" data-m="' + esc(x.m) + '">Ahora no</button></div></div>').join('') +
    '<span class="xs mu">Más series semanales dan más hipertrofia, cada vez con menos ganancia por serie (Pelland et al., 2026, metarregresión; nivel ALTO). Subir de 1 en 1 cuando te estancas es una decisión de diseño de la app.</span></section>';
}

/* ---------- récord en la sesión ---------- */
function esRecord(ej, set, previasHoy) {
  const c = S.cat[ej]; if (!c || c.ayuda) return null;
  const h = historial(ej); if (!h.length) return null; // R-43: la primera sesión es la referencia
  const v = epley(set.kg, set.reps); if (v == null) return null;
  let best = Math.max(...h.map((x) => mejorE1(x.series) || 0)); for (const p of previasHoy) best = Math.max(best, epley(p.kg, p.reps) || 0);
  return v > best + 0.01 ? { v, mejora: v - best } : null;
}
function celebrar(nom, set, r) {

}

/* ---------- sesión ---------- */
function prepEj(e) {

  if (deloadActivo() && sug.ult) { const h = historial(e.ej); const u = h[h.length - 1]; const top = S.cat[e.ej]?.ayuda ? Math.min(...u.series.map((x) => x.kg)) : maxKg(u.series); sug.kg = top; sug.reps = e.min; sug.tipo = 'deload'; sug.txt = 'Semana de descarga: mismo peso que la última vez (' + kgf(top) + ' kg) y para cuando te queden 3–4 repeticiones.'; } // R-82

      if (a.rir == null) { aviso('Elige cuántas repeticiones te quedaban (RIR)'); break; }
      const e = a.ejercicios[a.idx]; const nueva = { kg: a.kg, reps: a.reps, rir: a.rir };
      const rec = esRecord(e.ej, nueva, e.series); if (rec) nueva.pr = true;
      e.series.push(nueva); a.extra = false; guardarActiva();
      if (rec) setTimeout(() => celebrar(nombre(e.ej), nueva, rec), 30);
      const c = S.cat[e.ej] || {}; S.restTotal = c.compuesto ? (S.aj?.descansoCompuesto || 120) : (S.aj?.descansoAislamiento || 90); S.restEnd = Date.now() + S.restTotal * 1000; // R-71
      render(); break;
    }
    case 'borrarSerie': a.ejercicios[a.idx].series.splice(+b.dataset.k, 1); guardarActiva(); render(); break;
    case 'ejNext': {
      const e = a.ejercicios[a.idx]; const f = (e.plan?.series || 0) - e.series.length;
      if (f > 0 && S.skipWarn !== a.idx) { S.skipWarn = a.idx; aviso('Te ' + (f === 1 ? 'falta 1 serie' : 'faltan ' + f + ' series') + ' de ' + nombre(e.ej) + '. Toca otra vez para pasar igualmente.'); break; }
      S.skipWarn = null; a.idx++; a.extra = false; cargarInputs(); guardarActiva(); window.scrollTo(0, 0); render(); break;
    }
    case 'extra': a.extra = true; cargarInputs(); render(); break;
    case 'ejPrev': a.idx--; a.extra = false; cargarInputs(); guardarActiva(); window.scrollTo(0, 0); render(); break;
    case 'rest15': S.restEnd += 15000; S.restTotal += 15; render(); break;
    case 'restSkip': S.restEnd = 0; render(); break;
    case 'salirSesion': S.view = 'hoy'; S.prev = []; render(); break;
    case 'terminar': {
      const f = a ? a.ejercicios.reduce((t, x) => t + Math.max(0, (x.plan?.series || 0) - x.series.length), 0) : 0;
      if (f > 0 && !S.endWarn) { S.endWarn = true; aviso('Quedan ' + f + ' series sin hacer. Toca otra vez para terminar igualmente.'); setTimeout(() => { S.endWarn = false; }, 6000); break; }
      S.endWarn = false; await terminar(); break;
    }
    case 'calSel': S.calSel = v; render(); break;
    case 'detSes': S.detId = b.dataset.id; ir('detSes'); break;
    case 'mes': { const t = hoy(); const M = S.calMes || new Date(t.getFullYear(), t.getMonth(), 1); S.calMes = new Date(M.getFullYear(), M.getMonth() + (+b.dataset.d), 1); render(); break; }
    case 'addAct': {
      const f = S.calSel || ymd(hoy()); const tipo = $('#dep').value; const min = parseInt($('#min').value, 10) || 0; const rpe = Math.min(10, Math.max(0, parseInt($('#rpe').value, 10) || 0)) || null;
      const doc = { fecha: f, tipo, minutos: min, rpe, planificada: parseD(f) > hoy() };
      try { await guardar('actividades', f + '_' + uid(), doc); aviso('Añadido: ' + tipo); } catch (e) {}
      render(); break;
    }
    case 'borrarAct': await borrar('actividades', b.dataset.id); render(); break;
    case 'progTab': S.progTab = v; render(); break;
    case 'hojaSemana': $('#layer').innerHTML = hojaSemana(); break;
    case 'cerrarHoja': if (b.classList.contains('sheet-bg') && ev.target.closest('.sheet')) break; $('#layer').innerHTML = ''; break;
    case 'marcarSemana': guardarEstado({ semana: v ? { lunes: ymd(lunes(hoy())), tipo: v } : null }); $('#layer').innerHTML = ''; aviso(v ? 'Semana marcada: ' + ESTADOS[v] : 'Marca quitada'); render(); break;
    case 'iniDeload': { const t = hoy(); const f = new Date(t); f.setDate(t.getDate() + 6); guardarEstado({ deload: { desde: ymd(t), hasta: ymd(f) } }); aviso('Semana de descarga activada'); render(); break; }
    case 'noDeload': guardarEstado({ deloadDescartado: ymd(hoy()) }); render(); break;
    case 'finDeload': { const y = new Date(hoy()); y.setDate(y.getDate() - 1); guardarEstado({ deload: Object.assign({}, S.estado.deload, { hasta: ymd(y) }) }); render(); break; }
    case 'musculo': S.musSel = S.musSel === b.dataset.m ? null : b.dataset.m; render(); break;
    case 'addSerieRut': { const r = JSON.parse(JSON.stringify(S.rut[b.dataset.id])); const it = r.ejercicios.find((x) => x.ej === b.dataset.ej); if (it) { it.series += 1; await guardar('rutinas', b.dataset.id, r).catch(() => {}); guardarEstado({ volDescartado: Object.assign({}, S.estado?.volDescartado || {}, { [b.dataset.m]: ymd(hoy()) }) }); aviso('Añadida 1 serie a ' + nombre(b.dataset.ej) + ' en ' + r.nombre); } render(); break; } // R-12
    case 'noVol': guardarEstado({ volDescartado: Object.assign({}, S.estado?.volDescartado || {}, { [b.dataset.m]: ymd(hoy()) }) }); render(); break;

    case 'bien': { const k = ymd(hoy()); const o = Object.assign({}, S.bien[k] || {}, { [b.dataset.k]: +v }); S.bien[k] = o; render(); if (S.db) S.db.collection('bienestar').doc(k).set(o).catch(() => aviso('No se ha podido guardar.')); break; }
    case 'calcReps': S.calc.reps = Math.max(1, Math.min(20, S.calc.reps + (+b.dataset.d))); render(); break;
    case 'calcRir': S.calc.rir = Math.max(0, Math.min(4, S.calc.rir + (+b.dataset.d))); render(); break;
    case 'ejSel': S.ejSel = b.dataset.id; window.scrollTo(0, 0); render(); break;
  }
});
document.addEventListener('input', (ev) => {

/* ---------- arranque ---------- */
function aplicar(col, docs) {
  if (col === 'catalogo') { const d = docs.find((x) => x._id === 'ejercicios'); if (d) S.cat = d.items || {}; }
  if (col === 'rutinas') { S.rut = {}; for (const d of docs) { const o = Object.assign({}, d); delete o._id; S.rut[d._id] = o; } }
  if (col === 'sesiones') S.ses = docs;
  if (col === 'actividades') S.act = docs;
  if (col === 'ajustes') { S.aj = docs.find((x) => x._id === 'general') || S.aj; S.saludMeta = docs.find((x) => x._id === 'salud') || S.saludMeta; S.estado = docs.find((x) => x._id === 'estado') || S.estado; }
  if (col === 'salud') { S.salud = {}; for (const d of docs) S.salud[d._id] = d.dias || {}; }
  if (col === 'bienestar') { S.bien = {}; for (const d of docs) S.bien[d._id] = d; }
}
async function arrancar() {
  render();
  let db = null;
  const user = await Nube.init();
  if (!Nube.sb) { $('#app').innerHTML = '<div class="wrap"><div class="empty">Falta configurar la conexión (config.js).</div></div>'; return; }
  if (!user) { S.mode = 'login'; render(); return; }
  db = Nube;
  if (db) {
    S.db = db; S.mode = 'nube';
    const cols = ['catalogo', 'rutinas', 'sesiones', 'actividades', 'ajustes', 'salud', 'bienestar'];
    let pending = cols.length;
    for (const col of cols) {
      db.collection(col).limit(1000).onSnapshot((snap) => {
        aplicar(col, snap.docs.map((d) => Object.assign({ _id: d.id }, d.data())));
        if (pending > 0) pending--;
        const tag = document.activeElement?.tagName;
        if (tag === 'INPUT' || tag === 'SELECT') return; // no pisar lo que se está escribiendo
        render();
      });
    }
    if (!Object.keys(Nube.cache).length) aviso('Cargando tus datos…');
    Nube.pull().then(() => sincronizarSalud()).then(() => Nube.token().then((t) => { S.tokenAtajo = t; }));
    const refrescar = () => { if (document.visibilityState === 'visible') Nube.pull().then(() => sincronizarSalud()); };
    document.addEventListener('visibilitychange', refrescar); window.addEventListener('online', refrescar);
    window.addEventListener('nube', () => { const tag = document.activeElement?.tagName; if (tag !== 'INPUT' && tag !== 'SELECT') render(); });
    try { const s = await db.collection('estado').doc('activa').get(); const v = s.exists ? s.data().sesion : null; if (v) S.activa = v; else if (ls.get('activa')) S.activa = ls.get('activa'); } catch (e) { S.activa = ls.get('activa'); }
  } else {
    S.mode = 'local';
    const seed = window.__RESERVA_SEED || [];
    const by = {};
    for (const o of seed) (by[o.collection] = by[o.collection] || {})[o.doc_id] = o.data;
    for (const col of ['catalogo', 'rutinas', 'sesiones', 'actividades', 'ajustes', 'salud', 'bienestar']) { const o = Object.assign({}, by[col] || {}, ls.get('local.' + col) || {}); aplicar(col, Object.entries(o).map(([k, d]) => Object.assign({ _id: k }, d))); }
    S.activa = ls.get('activa'); S.estado = ls.get('estado');
  }
  if (S.activa) { S.view = 'sesion'; S.prev = ['hoy']; }
  render();
}

/* =====================================================================
   Nube: los datos viven en Supabase (tabla docs, protegida por usuario).
   La app trabaja siempre contra una copia local: funciona sin cobertura
   y los cambios se envían cuando vuelve la conexión (cola «outbox»).
   Imita la parte de la API que usaba la versión de Claude:
   collection(col).limit(n).onSnapshot(cb) · collection(col).doc(id).set/get/delete
   ===================================================================== */
const Nube = {
  sb: null, user: null, cache: {}, outbox: [], subs: {}, flushing: false,
  load() { try { this.cache = JSON.parse(localStorage.getItem('reserva.cache') || '{}'); this.outbox = JSON.parse(localStorage.getItem('reserva.outbox') || '[]'); } catch (e) { this.cache = {}; this.outbox = []; } },
  persist() { try { localStorage.setItem('reserva.cache', JSON.stringify(this.cache)); localStorage.setItem('reserva.outbox', JSON.stringify(this.outbox)); } catch (e) {} },
  async init() {
    const C = window.RESERVA_CFG || {};
    if (!window.supabase || !C.url || !C.anon) return null;
    this.sb = window.supabase.createClient(C.url, C.anon, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'reserva.auth' } });
    this.load();
    try { const { data } = await this.sb.auth.getSession(); this.user = data.session?.user || null; } catch (e) { this.user = null; }
    this.sb.auth.onAuthStateChange((_ev, ses) => { this.user = ses?.user || null; });
    return this.user;
  },
  emit(col) { const docs = Object.entries(this.cache[col] || {}).map(([id, d]) => ({ id, exists: true, data: () => d })); for (const cb of this.subs[col] || []) { try { cb({ docs, size: docs.length, empty: !docs.length }); } catch (e) { console.error(e); } } },
  collection(col) {
    const self = this;
    return { limit() { return this; }, onSnapshot(cb) { (self.subs[col] = self.subs[col] || []).push(cb); self.emit(col); return () => {}; }, doc(id) { return self.doc(col + '/' + id); } };
  },
  doc(path) {
    const [col, id] = path.split('/'); const self = this;
    const quitar = () => { self.outbox = self.outbox.filter((o) => !(o.col === col && o.id === id)); };
    return {
      async get() { const d = self.cache[col]?.[id]; return { exists: !!d, data: () => d }; },
      async set(data) { (self.cache[col] = self.cache[col] || {})[id] = JSON.parse(JSON.stringify(data)); quitar(); self.outbox.push({ op: 'set', col, id, data }); self.persist(); self.emit(col); self.flush(); },
      async delete() { if (self.cache[col]) delete self.cache[col][id]; quitar(); self.outbox.push({ op: 'del', col, id }); self.persist(); self.emit(col); self.flush(); }
    };
  },
  async flush() {
    if (this.flushing || !this.user || !navigator.onLine || !this.outbox.length) return;
    this.flushing = true;
    try {
      while (this.outbox.length) {
        const o = this.outbox[0]; let r;
        if (o.op === 'set') r = await this.sb.from('docs').upsert({ user_id: this.user.id, col: o.col, id: o.id, data: o.data, updated_at: new Date().toISOString() });
        else r = await this.sb.from('docs').delete().eq('col', o.col).eq('id', o.id);
        if (r.error) throw r.error;
        this.outbox.shift(); this.persist();
      }
    } catch (e) { console.warn('Sin sincronizar todavía', e); }
    finally { this.flushing = false; window.dispatchEvent(new Event('nube')); }
  },
  async pull() {
    if (!this.user || !navigator.onLine) return false;
    await this.flush(); if (this.outbox.length) return false;
    const filas = []; let desde = 0;
    for (;;) { const { data, error } = await this.sb.from('docs').select('col,id,data').range(desde, desde + 999); if (error) return false; filas.push(...data); if (data.length < 1000) break; desde += 1000; }
    const c = {}; for (const r of filas) (c[r.col] = c[r.col] || {})[r.id] = r.data;
    this.cache = c; this.persist(); for (const col in this.subs) this.emit(col);
    window.dispatchEvent(new Event('nube')); return true;
  },
  async saludPendiente() { // lo que ha enviado el atajo (R-146)
    if (!this.user || !navigator.onLine) return null;
    const { data, error } = await this.sb.from('salud_raw').select('n,payload').order('n').limit(200);
    if (error || !data?.length) return null;
    return { texto: data.map((x) => x.payload).join('\n'), hasta: data[data.length - 1].n };
  },
  async borrarSalud(hasta) { await this.sb.from('salud_raw').delete().lte('n', hasta); },
  async token() {
    const { data } = await this.sb.from('atajo_tokens').select('token').maybeSingle();
    if (data?.token) return data.token;
    const t = Array.from(crypto.getRandomValues(new Uint8Array(24))).map((b) => b.toString(16).padStart(2, '0')).join('');
    const r = await this.sb.from('atajo_tokens').upsert({ user_id: this.user.id, token: t });
    return r.error ? null : t;
  },
  async salir() { try { await this.sb.auth.signOut(); } catch (e) {} localStorage.removeItem('reserva.cache'); localStorage.removeItem('reserva.outbox'); location.reload(); }
};

/* ---------- entrar, cuenta, atajo y copia de seguridad (solo versión web) ---------- */
function vLogin() {
  return '<div class="wrap noTab" style="min-height:100%;justify-content:center">' +
    '<div class="stack" style="gap:6px;align-items:flex-start"><span class="brand" style="font-size:34px">' + I.logo('var(--ac)').replace('width="26" height="26"', 'width="44" height="44"') + 'Reserva</span><span class="mu">Tu entrenamiento, tu descanso y tu comida, en un sitio.</span></div>' +
    '<form class="card pad stack" id="fLogin" style="gap:10px"><label class="lbl xs mu" for="em">Correo<input id="em" class="field" type="email" autocomplete="username" required></label>' +
    '<label class="lbl xs mu" for="pw">Contraseña<input id="pw" class="field" type="password" autocomplete="current-password" minlength="8" required></label>' +
    '<button class="btn" type="submit" data-modo="entrar">Entrar</button><button class="btn sec" type="submit" data-modo="crear">Crear mi cuenta</button>' +
    '<span class="xs mu" id="loginMsg">La primera vez, pon tu correo y una contraseña de al menos 8 caracteres y toca «Crear mi cuenta».</span></form></div>';
}
async function enviarLogin(ev) {
  ev.preventDefault();
  const modo = ev.submitter?.dataset.modo || 'entrar';
  const email = $('#em').value.trim(), password = $('#pw').value; const msg = $('#loginMsg');
  msg.textContent = modo === 'crear' ? 'Creando la cuenta…' : 'Entrando…';
  try {
    if (modo === 'crear') {
      const { data, error } = await Nube.sb.auth.signUp({ email, password, options: { emailRedirectTo: location.origin + location.pathname } });
      if (!error && data?.session) { Nube.user = data.user; location.reload(); return; }
      msg.textContent = error ? 'No se ha podido crear: ' + error.message : 'Hecho. Abre el correo que te ha llegado, toca el enlace para confirmar y vuelve aquí a «Entrar».';
    } else {
      const { data, error } = await Nube.sb.auth.signInWithPassword({ email, password });
      if (error) { msg.textContent = /confirm/i.test(error.message) ? 'Falta confirmar el correo: abre el enlace que te llegó.' : 'Correo o contraseña incorrectos.'; return; }
      Nube.user = data.user; location.reload();
    }
  } catch (e) { msg.textContent = 'Sin conexión. Inténtalo cuando tengas cobertura.'; }
}

function vCuenta() {
  const pend = Nube.outbox.length;
  const tk = S.tokenAtajo;
  const C = window.RESERVA_CFG || {};
  const urlRpc = (C.url || '') + '/rest/v1/rpc/ingest_salud';
  return '<div class="wrap noTab"><div class="top"><button class="back" data-act="volver">' + I.back + 'Hoy</button></div><h1 class="d">Ajustes</h1>' +
    '<section class="card pad stack"><span class="cap">Cuenta</span><span>' + esc(Nube.user?.email || '') + '</span><span class="xs mu">' + (pend ? pend + ' cambios esperando conexión para guardarse.' : 'Todo guardado en tu cuenta.') + '</span><button class="btn sec slim" data-act="salir" style="align-self:flex-start">Cerrar sesión</button></section>' +
    '<section class="card pad stack"><span class="cap">Atajo de Salud</span>' +
    (tk ? '<span class="sm" style="color:var(--tx2)">En tu atajo <b>Reserva.Salud</b>, añade al final la acción <b>«Obtener contenido de URL»</b> con estos datos:</span>' +
      '<div class="stack" style="gap:6px"><span class="xs mu">URL</span><code class="cbox">' + esc(urlRpc) + '</code><button class="btn sec slim" data-act="copiar" data-txt="' + esc(urlRpc) + '">Copiar URL</button>' +
      '<span class="xs mu">Cabeceras: <b>apikey</b></span><code class="cbox">' + esc(C.anon || '') + '</code><button class="btn sec slim" data-act="copiar" data-txt="' + esc(C.anon || '') + '">Copiar apikey</button>' +
      '<span class="xs mu">Cuerpo (JSON): <b>p_token</b> = este texto, <b>p_payload</b> = Texto combinado</span><code class="cbox">' + esc(tk) + '</code><button class="btn sec slim" data-act="copiar" data-txt="' + esc(tk) + '">Copiar clave del atajo</button></div>' +
      '<span class="xs mu">La clave solo sirve para enviar datos de Salud a tu cuenta; no deja leer nada. No la compartas.</span>'
      : '<button class="btn slim" data-act="crearToken" style="align-self:flex-start">Preparar el atajo</button>') + '</section>' +
    '<section class="card pad stack"><span class="cap">Copia de seguridad</span><span class="sm" style="color:var(--tx2)">Importa la copia de la versión anterior o guarda una copia de todo.</span>' +
    '<label class="btn sec slim" for="fileCopia" style="align-self:flex-start;cursor:pointer">Importar copia (.json)</label><input id="fileCopia" type="file" accept=".json,application/json" hidden>' +
    '<button class="btn sec slim" data-act="exportar" style="align-self:flex-start">Descargar copia</button></section>' +
    '<p class="mu xs" style="margin:0">Reserva · tus datos se guardan en tu propia base de datos de Supabase y solo puedes verlos tú.</p></div>';
}
async function importarCopia(file) {
  let o; try { o = JSON.parse(await file.text()); } catch (e) { aviso('Ese archivo no es una copia de Reserva.'); return; }
  if (!o || !Array.isArray(o.docs)) { aviso('Ese archivo no es una copia de Reserva.'); return; }
  for (const d of o.docs) { if (d.col === 'estado') continue; await Nube.doc(d.col + '/' + d.id).set(d.data); }
  await Nube.flush(); aviso('Importados ' + o.docs.length + ' documentos'); render();
}
function exportarCopia() {
  const docs = []; for (const col in Nube.cache) for (const id in Nube.cache[col]) docs.push({ col, id, data: Nube.cache[col][id] });
  const blob = new Blob([JSON.stringify({ app: 'Reserva', version: 1, exportado: ymd(hoy()), docs })], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'reserva_copia_' + ymd(hoy()) + '.json'; document.body.appendChild(a); a.click(); a.remove();
}
async function sincronizarSalud() { // lo que envió el atajo entra solo (R-146)
  try { const p = await Nube.saludPendiente(); if (!p) return; const n = Object.keys(parseSalud(p.texto)).length; await importarSaludTexto(p.texto, !n); await Nube.borrarSalud(p.hasta); } catch (e) { console.warn(e); }
}

arrancar();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
